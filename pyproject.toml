#uv pip install --system --break-system-packages -r pyproject.toml --group=experiments
#uv pip sync - синхронизирует буквально по списку
#uv pip install - устанавливает все зависимости

[project]
name = "transfer-pruning-sandbox"
version = "0.0.1"

requires-python = "==3.10.0"

dependencies = [
    "matplotlib>=3.7.5",
    "ipykernel",
    "regex",
    "numpy",
    "ipywidgets",
    "openpyxl>=3.1.5",
    "torch==2.10.0",
    "torchvision==0.25.0", #need for multimodal models. !Important, because linked with torch.
    "dotenv>=0.9.9",
    "seaborn>=0.13.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

transformer_lens = [
    "bitsandbytes>=0.49.2",
    "gptqmodel==7.0.0", #for support patched experts in fused modules in transformers 5
    #--no-build-isolation need for it (too see torch from gptqmodel when install)
    "huggingface-hub>=1.23.0",
    "kernels>=0.12,<0.13",
    "mlflow>=3.17.0",
    "boto3>=1.43.109",
    "optimum>=2.2.0",
    "torch-pruning==1.6.1+glazkov.1",
    "torchinfo>=1.8.0",
    "transformer-lens",
    "transformers==5.9.0", #для дипсика нужна, но для qwen загрузки нужна 4.51 так как сохранены веса в этой версии и загружаются с перевыделением памяти.
    #плюс в новых трансформерах эксперты - один трёхмерный жирный параметр. В старых - отдельные слои с nn.Linear внутри
    #"torch==2.11.0", #отбой, torch==2.11.0 не поддерживает cuda 12.4
    "unsloth>=2025.9.5",
]

[tool.uv.sources]
# Concat dimension fix; keep the revision aligned with .github/requirements-cpu.txt.
torch-pruning = { git = "https://github.com/Martakor1/Torch-Pruning.git", rev = "8285eb8d0b1d313eac5af93f5f7d0c24e278b0d8" }
transformer-lens = {
    path = "../TransformerLens", 
    editable = true,
}
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[tool.uv.extra-build-dependencies]
gptqmodel = [{ requirement = "torch", match-runtime = true }] #because torch is not in dependencies in gptqmodel

